<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Gym Tracker</title>
<script src="chart.umd.min.js"></script>
<script src="whobmi.js"></script>
<style>
:root{--bg:#0b0c10;--card:#15171e;--card2:#1d2029;--line:#2a2e3b;--tx:#f3f4f6;--mu:#9097a8;--ac:#ff7a1a;--ac2:#ff9a4d;--ok:#22c55e;--er:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--ac)}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{background:linear-gradient(135deg,var(--ac),#ea580c);color:#fff;font-weight:700;border-radius:14px;padding:13px 18px;width:100%;text-align:center;display:block}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:10px;display:inline-block}
.btn.ghost{background:var(--card2);color:var(--tx);font-weight:600}
.btn.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
.btn:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mu{color:var(--mu)}.sm-t{font-size:13px}.xs-t{font-size:12px}
h1{font-size:26px;font-weight:800}h2{font-size:21px;font-weight:800;margin-bottom:14px}h3{font-size:16px;font-weight:700}
.stack>*+*{margin-top:12px}
.top{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.ibtn{background:var(--card2);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:18px}
.menu{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,12,16,.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav button{flex:1;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-size:11px}
.nav button span{font-size:20px}.nav button.on{color:var(--ac)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,122,26,.15);color:var(--ac2)}
.pill.ok{background:rgba(34,197,94,.15);color:var(--ok)}
.pill.off{background:rgba(239,68,68,.15);color:#f87171}
.ex{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
.ex.done{border-color:rgba(34,197,94,.5)}
.setbox{background:var(--card2);border-radius:14px;padding:12px;margin-top:10px}
.stp{display:flex;align-items:center;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stp button{width:44px;height:48px;font-size:22px;font-weight:700;color:var(--ac2)}
.stp input{border:0;background:transparent;text-align:center;font-weight:700;font-size:18px;padding:0;min-width:0;border-radius:0}
.lbl{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px}
.ints{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ints button{height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:800;color:var(--mu)}
.ints button.on{color:#fff;border-color:transparent;transform:scale(1.05)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:var(--card2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);border-radius:99px;width:30px;height:30px;color:#fff}
.ph .wait{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);border-radius:99px;padding:3px 9px;font-size:11px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;color:#fff;background:var(--ok);box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.toast.er{background:var(--er)}
.ov{position:fixed;inset:0;background:rgba(11,12,16,.8);display:grid;place-items:center;z-index:90}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--er);font-size:14px;margin-top:10px}
.link{color:var(--ac2);font-weight:600}
.hist{background:var(--card2);border-radius:12px;padding:10px 12px}
.chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;margin:3px 4px 0 0}
.fade{animation:f .25s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.fld{display:block}.fld>span{display:block;font-size:12px;color:var(--mu);margin:0 0 4px 2px}
input[readonly],input:disabled,select:disabled{opacity:.6;cursor:not-allowed}
.imc{border-width:1px}
.imc .val{font-size:44px;font-weight:900;line-height:1}
.imc .cls{font-size:17px;font-weight:800}
.scale{display:flex;gap:3px;margin-top:12px}.scale i{flex:1;height:8px;border-radius:4px;background:var(--line);opacity:.5}.scale i.on{opacity:1;box-shadow:0 0 0 2px var(--tx)}
.cam{position:fixed;inset:0;background:#000;z-index:95;display:flex;flex-direction:column}
.cam video,.cam img{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.cam .bar{display:flex;align-items:center;justify-content:space-around;padding:16px 12px calc(16px + env(safe-area-inset-bottom));background:#000}
.shut{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#ff7a1a}
.cbtn{background:#222;color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;min-width:84px;text-align:center}
</style>
</head>
<body>

<div id="loading" class="ov hidden"><div class="spin"></div></div>

<!-- LOGIN -->
<div id="login" class="hidden wrap" style="padding-top:12vh">
  <div style="text-align:center;margin-bottom:28px">
    <div style="font-size:54px">💪</div>
    <h1>Gym Tracker</h1>
    <p class="mu" style="margin-top:6px">Sua evolução, treino a treino</p>
  </div>
  <div class="card stack">
    <div id="loginForm" class="stack">
      <h3>Entrar</h3>
      <input id="lu" placeholder="Usuário" autocapitalize="none" autocomplete="username">
      <input id="lp" type="password" placeholder="Senha" autocomplete="current-password">
      <button class="btn" onclick="doLogin()">Entrar</button>
      <p class="mu sm-t" style="text-align:center">Não tem conta? <button class="link" onclick="toggleReg(true)">Criar conta</button></p>
    </div>
    <div id="regForm" class="hidden stack">
      <h3>Criar conta</h3>
      <label class="fld"><span>Nome completo</span><input id="rn" placeholder="Nome e sobrenome" autocomplete="name"></label>
      <label class="fld"><span>E-mail</span><input id="re" type="email" placeholder="voce@email.com" autocapitalize="none" autocomplete="email"></label>
      <label class="fld"><span>Telefone (com DDD)</span><input id="rt" type="tel" placeholder="(11) 99999-9999" autocomplete="tel"></label>
      <div class="grid2">
        <label class="fld"><span>Altura (cm)</span><input id="rh" type="number" inputmode="numeric" placeholder="175" min="100" max="250"></label>
        <label class="fld"><span>Sexo</span><select id="rs"><option value="">Selecione</option><option value="M">Masculino</option><option value="F">Feminino</option></select></label>
      </div>
      <label class="fld"><span>Data de nascimento (não poderá ser alterada)</span><input id="rb" type="date"></label>
      <label class="fld"><span>Nome de usuário (não poderá ser alterado)</span><input id="ru" placeholder="usuario" autocapitalize="none" autocomplete="username"></label>
      <label class="fld"><span>Senha</span><input id="rp" type="password" placeholder="mín. 4 caracteres" autocomplete="new-password"></label>
      <label class="fld"><span>Código de convite</span><input id="ri" placeholder="Código de convite" autocapitalize="characters" autocomplete="off"></label>
      <button class="btn" onclick="doRegister()">Criar conta</button>
      <p class="mu sm-t" style="text-align:center"><button class="link" onclick="toggleReg(false)">← Voltar</button></p>
    </div>
    <p id="lerr" class="err hidden"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="top">
    <div><div class="mu xs-t">Olá, <span id="uname" style="font-weight:800;color:var(--tx)"></span></div><span id="badge" class="pill ok" style="margin-top:3px">● Online</span></div>
    <div class="row">
      <button class="ibtn" onclick="go('profile')" title="Meu perfil">👤</button>
      <button class="ibtn" onclick="go('settings')" title="Treinos">⚙️</button>
      <button class="ibtn" onclick="logout()" title="Sair">🚪</button>
    </div>
  </div>
  <div id="view" class="wrap"></div>
  <div class="nav">
    <button id="n-home" onclick="go('home')"><span>🏠</span>Início</button>
    <button id="n-checkin" onclick="go('checkin')"><span>✅</span>Check-in</button>
    <button id="n-weight" onclick="go('weight')"><span>⚖️</span>Peso</button>
    <button id="n-evo" onclick="go('evo')"><span>📈</span>Evolução</button>
  </div>
</div>

<!-- CÂMERA -->
<div id="cam" class="cam hidden">
  <video id="camv" playsinline muted autoplay></video>
  <img id="camimg" class="hidden" alt="Pré-visualização">
  <div id="camfb" class="hidden" style="flex:1;display:grid;place-items:center;color:#fff;text-align:center;padding:24px">
    <div><p style="margin-bottom:16px">Não foi possível abrir a câmera dentro do app.<br>Use a câmera do celular:</p>
    <label class="btn" style="cursor:pointer">Abrir câmera do celular<input id="camfile" type="file" accept="image/*" capture="environment" hidden onchange="photoFromFile(event)"></label></div>
  </div>
  <div id="cambar" class="bar">
    <button class="cbtn" onclick="camClose()">Cancelar</button>
    <button id="camshut" class="shut" onclick="camShoot()" aria-label="Tirar foto"></button>
    <button id="camflip" class="cbtn" onclick="camFlip()">Virar</button>
  </div>
  <div id="camconf" class="bar hidden">
    <button class="cbtn" onclick="camRetake()">Refazer</button>
    <button class="cbtn" style="background:#16a34a" onclick="camUse()">Usar foto</button>
  </div>
</div>

<script>
// ===== CONFIGURAÇÃO: URL da implantação do Apps Script (termina em /exec) =====
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbztT3FiQ2Ljv0rBOUcjGW2-Bb7Mpx4i6o28bjZf4fW9eYZNfrJvgI_1ULNRu3zVmANW6Q/exec';

const INT_COLORS = ['#4b5563','#16a34a','#ca8a04','#ea580c','#dc2626','#7f1d1d'];
const INT_LABELS = ['Muito leve','Leve','Moderado','Pesado','Muito pesado','Máximo'];
const S = { token:null, user:null, D:null, outbox:[], syncing:false, done:{}, cw:null, view:'home', needLogin:false };

// ---------- util ----------
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const num = v => Number(v) || 0;
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function fmtDate(d){ if(!d) return ''; const s = String(d).slice(0,10).split('-'); return s.length===3 ? s[2]+'/'+s[1]+'/'+s[0] : d }
function localDate(d=new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function toast(m, er){ const t=document.createElement('div'); t.className='toast'+(er?' er':''); t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2800) }

// ---------- armazenamento local (IndexedDB) ----------
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res,rej) => {
    const r = indexedDB.open('gymtracker',1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  return {
    get: k => open().then(db => new Promise((res,rej) => { const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error) })),
    set: (k,v) => open().then(db => new Promise((res,rej) => { const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error) }))
  };
})();
const save = () => Promise.all([idb.set('D:'+S.user, S.D), idb.set('O:'+S.user, S.outbox)]).catch(()=>toast('Falha ao salvar no aparelho',true));

// ---------- rede ----------
async function api(action, payload){
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 45000);
  try{
    const res = await fetch(SCRIPT_URL, { method:'POST', body:JSON.stringify({action, token:S.token, payload:payload||{}}), signal:ctl.signal });
    return await res.json();
  }catch(e){ return { error:'OFFLINE' } }
  finally{ clearTimeout(to) }
}

function setBadge(){
  const b = $('badge'); if(!b) return;
  const n = S.outbox.length, on = navigator.onLine;
  if(S.needLogin){ b.className='pill off'; b.textContent='● Entre novamente p/ sincronizar'; return }
  if(S.syncing){ b.className='pill'; b.textContent='⟳ Sincronizando…'; return }
  if(!on){ b.className='pill off'; b.textContent='● Offline'+(n?' · '+n+' pendente'+(n>1?'s':''):''); return }
  if(n){ b.className='pill'; b.textContent='● '+n+' pendente'+(n>1?'s':''); return }
  b.className='pill ok'; b.textContent='● Sincronizado';
}

async function sync(){
  if(S.syncing || !S.token || !S.D || S.needLogin || !navigator.onLine) return setBadge();
  S.syncing = true; setBadge();
  let progressed = false;
  try{
    if(S.outbox.length){
      const ops = S.outbox.slice();
      const r = await api('batch', { ops: ops.map(o => ({action:o.action, payload:o.payload})) });
      if(r.error === 'AUTH'){ S.needLogin = true; toast('Sessão expirada. Entre novamente — seus dados estão salvos.', true); return }
      if(r.error) return;
      const failed = (r.results||[]).filter(x => x && x.error);
      S.outbox.splice(0, ops.length); progressed = true; await save();
      if(failed.length) toast(failed[0].error + (failed.length>1 ? ' (+'+(failed.length-1)+')' : ''), true);
    }
    if(!S.outbox.length){
      const b = await api('bootstrap');
      if(b.error === 'AUTH'){ S.needLogin = true; return }
      if(!b.error){
        S.D = norm(b); await save(); progressed = true;
        if(profileIncomplete() && S.view!=='profile') go('profile');
        else if(['home','photos','weight'].includes(S.view)) go(S.view);
      }
    }
  } finally {
    S.syncing = false; setBadge();
    if(progressed && S.outbox.length) setTimeout(sync, 300);
  }
}

function op(action, payload){ S.outbox.push({action, payload}); save(); setBadge(); sync() }

window.addEventListener('online', () => { setBadge(); sync() });
window.addEventListener('offline', setBadge);

// ---------- auth ----------
function toggleReg(on){ $('regForm').classList.toggle('hidden',!on); $('loginForm').classList.toggle('hidden',on); hide('lerr') }
function lerr(m){ const e=$('lerr'); e.textContent=m; show('lerr') }
function busy(on){ $('loading').classList.toggle('hidden',!on) }

async function doLogin(){
  const username=$('lu').value.trim().toLowerCase(), password=$('lp').value;
  if(!username||!password) return lerr('Preencha usuário e senha');
  if(!navigator.onLine) return lerr('Para entrar pela primeira vez é preciso estar online.');
  busy(true); const r = await api('login',{username,password}); busy(false);
  if(r.error) return lerr(r.error==='OFFLINE' ? 'Sem conexão com o servidor. Tente novamente.' : r.error);
  const sameUser = S.user === r.username;
  S.token=r.token; S.user=r.username; S.needLogin=false; lsSet('gt_token',r.token); lsSet('gt_user',r.username);
  if(sameUser && S.D){ enter(true) } else { await loadLocal(); enter(false) }
}
async function doRegister(){
  const username=$('ru').value.trim().toLowerCase(), password=$('rp').value, invite=$('ri').value.trim();
  const full_name=$('rn').value.trim(), email=$('re').value.trim(), phone=$('rt').value.trim();
  const height_cm=Number($('rh').value), sex=$('rs').value, birth_date=$('rb').value;
  if(full_name.split(/\s+/).filter(Boolean).length<2) return lerr('Informe nome e sobrenome');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return lerr('E-mail inválido');
  const digits = phone.replace(/\D/g,''); if(digits.length<10||digits.length>13) return lerr('Telefone inválido (com DDD)');
  if(!(height_cm>=100&&height_cm<=250)) return lerr('Altura inválida (100 a 250 cm)');
  if(!sex) return lerr('Informe o sexo');
  if(!birth_date || birth_date>localDate() || birth_date<'1900-01-01') return lerr('Data de nascimento inválida');
  if(!/^[a-z0-9_.-]{3,30}$/.test(username)) return lerr('Usuário: 3 a 30 letras minúsculas, números, ponto, hífen ou _');
  if(password.length<4) return lerr('Senha deve ter no mínimo 4 caracteres');
  if(!invite) return lerr('Informe o código de convite');
  busy(true); const r = await api('register',{username,password,invite,full_name,email,phone,height_cm,sex,birth_date}); busy(false);
  if(r.error) return lerr(r.error==='OFFLINE' ? 'Sem conexão com o servidor.' : r.error);
  toggleReg(false); $('lu').value=username.toLowerCase(); toast('Conta criada! Faça login.');
}
function logout(){
  if(S.outbox.length && !confirm('Há '+S.outbox.length+' alterações ainda não sincronizadas. Elas ficam salvas neste aparelho, mas sair agora impede o envio. Sair mesmo assim?')) return;
  S.token=null; S.needLogin=false; lsSet('gt_token'); hide('app'); show('login');
}

const norm = D => { D.weights = D.weights || []; D.photos = D.photos || []; return D };
async function loadLocal(){
  const d = (await idb.get('D:'+S.user).catch(()=>null)) || null;
  S.D = d ? norm(d) : null;
  S.outbox = (await idb.get('O:'+S.user).catch(()=>null)) || [];
}

async function enter(hasData){
  hide('login'); show('app'); $('uname').textContent = S.user; S.done = {};
  if(!S.D){
    busy(true); const b = await api('bootstrap'); busy(false);
    if(b.error){ toast(b.error==='OFFLINE' ? 'Sem conexão: conecte-se uma vez para baixar seus dados.' : 'Falha ao carregar dados', true); S.D = norm({workouts:[],exercises:[],checkins:[],sets:[],photos:[]}); }
    else { S.D = norm(b); await save() }
  }
  go('home'); setBadge(); sync();
}

// ---------- consultas locais ----------
const workouts = () => S.D.workouts.slice().sort((a,b)=>num(a.order_index)-num(b.order_index));
const exercisesOf = wid => S.D.exercises.filter(e=>e.workout_id===wid).sort((a,b)=>num(a.order_index)-num(b.order_index));
const currentCheckin = () => S.D.checkins.find(c=>!c.checkout_time) || null;
const completed = () => S.D.checkins.filter(c=>c.checkout_time).sort((a,b)=>new Date(b.checkin_time)-new Date(a.checkin_time));
const setsOf = (cid,eid) => S.D.sets.filter(s=>s.checkin_id===cid && s.exercise_id===eid).sort((a,b)=>num(a.set_number)-num(b.set_number));
function nextWorkout(){
  const w = workouts(); if(!w.length) return null;
  const last = completed()[0]; if(!last) return w[0];
  const lw = w.find(x=>x.id===last.workout_id); if(!lw) return w[0];
  return w[num(lw.order_index) % w.length] || w[0];
}
function lastSets(eid){
  const cur = currentCheckin();
  if(cur){ const s = setsOf(cur.id,eid); if(s.length) return s }
  for(const c of completed()){ const s = setsOf(c.id,eid); if(s.length) return s }
  return [];
}
function progression(eid){
  return S.D.checkins.filter(c=>c.checkout_time).sort((a,b)=>new Date(a.checkin_time)-new Date(b.checkin_time)).map(c=>{
    const sets = setsOf(c.id,eid); if(!sets.length) return null;
    return { date:c.date, sets, maxWeight:Math.max(...sets.map(s=>num(s.weight))),
      avgIntensity:Math.round(sets.reduce((t,s)=>t+num(s.intensity),0)/sets.length*10)/10,
      totalReps:sets.reduce((t,s)=>t+num(s.reps),0) };
  }).filter(Boolean);

// ---------- peso / idade / IMC ----------
const fmtKg = v => (Math.round(num(v)*10)/10).toFixed(1).replace('.',',');
const byDateDesc = (a,b) => String(b.date).localeCompare(String(a.date));
const latestWeight = () => S.D.weights.length ? S.D.weights.slice().sort(byDateDesc)[0] : null;
const shortDate = d => { const s = fmtDate(d).split('/'); return s.length===3 ? s[0]+'/'+s[1]+'/'+s[2].slice(2) : d };
function ageMonths(birth, ref=new Date()){
  const p = String(birth||'').slice(0,10).split('-').map(Number); if(p.length!==3||!p[0]) return null;
  let m = (ref.getFullYear()-p[0])*12 + (ref.getMonth()+1-p[1]); if(ref.getDate()<p[2]) m--; return Math.max(0,m);
}
const ageYears = b => { const m = ageMonths(b); return m==null ? null : Math.floor(m/12) };
const profileIncomplete = () => { const p = S.D && S.D.profile; return !!p && !!S.token && (!p.full_name||!p.email||!p.phone||!p.height_cm||!p.birth_date||!p.sex) };

function imcClass(bmi, birth, sex){
  const m = ageMonths(birth); if(m==null) return null;
  const mk = (scale, idx, criterio) => ({ scale, idx, label:scale[idx].l, color:scale[idx].c, criterio });
  if(m >= 720){
    const sc = [{l:'Abaixo do peso',c:'#38bdf8'},{l:'Peso normal (eutrófico)',c:'#22c55e'},{l:'Sobrepeso',c:'#eab308'}];
    return mk(sc, bmi<22 ? 0 : bmi<=27 ? 1 : 2, 'Critério para idosos (60 anos ou mais): abaixo de 22 · 22 a 27 · acima de 27');
  }
  if(m >= 240){
    const sc = [{l:'Abaixo do peso',c:'#38bdf8'},{l:'Peso normal (eutrófico)',c:'#22c55e'},{l:'Sobrepeso',c:'#eab308'},{l:'Obesidade grau I',c:'#f97316'},{l:'Obesidade grau II',c:'#ef4444'},{l:'Obesidade grau III',c:'#b91c1c'}];
    return mk(sc, bmi<18.5 ? 0 : bmi<25 ? 1 : bmi<30 ? 2 : bmi<35 ? 3 : bmi<40 ? 4 : 5, 'Critério da OMS para adultos: 18,5 · 25 · 30 · 35 · 40');
  }
  if(m >= 61){
    const tb = typeof WHO_BMI!=='undefined' && WHO_BMI[sex];
    if(!tb) return { note:'Informe o sexo no perfil para classificar o IMC.' };
    const c = tb[Math.min(m,228)-WHO_BMI_START];
    const sc = [{l:'Magreza acentuada',c:'#0ea5e9'},{l:'Magreza',c:'#38bdf8'},{l:'Peso normal (eutrófico)',c:'#22c55e'},{l:'Sobrepeso',c:'#eab308'},{l:'Obesidade',c:'#ef4444'},{l:'Obesidade grave',c:'#b91c1c'}];
    return mk(sc, bmi<c[0] ? 0 : bmi<c[1] ? 1 : bmi<=c[2] ? 2 : bmi<=c[3] ? 3 : bmi<=c[4] ? 4 : 5, 'Critério da OMS (5 a 19 anos): IMC por idade e sexo');
  }
  return { note:'Para menores de 5 anos a classificação do IMC deve ser feita por um profissional de saúde.' };
}

function imcCard(){
  const p = S.D.profile || {}, lw = latestWeight(), h = num(p.height_cm);
  if(!lw || !h) return `<div class="card imc"><div class="mu sm-t">IMC</div>
    <b>${!lw ? 'Lance seu peso corporal para calcular o IMC.' : 'Informe sua altura no perfil para calcular o IMC.'}</b>
    <div style="margin-top:10px"><button class="btn sm" onclick="go('${!lw?'weight':'profile'}')">${!lw?'Lançar peso':'Abrir perfil'}</button></div></div>`;
  const bmi = num(lw.weight_kg) / Math.pow(h/100, 2), c = imcClass(bmi, p.birth_date, p.sex), age = ageYears(p.birth_date);
  const valTxt = bmi.toFixed(1).replace('.',',');
  const info = fmtKg(lw.weight_kg)+' kg ('+shortDate(lw.date)+') · '+h+' cm'+(age!=null ? ' · '+age+' anos' : '');
  return `<div class="card imc" style="${c&&c.color?'border-color:'+c.color:''}">
    <div class="mu sm-t">IMC atual</div>
    <div class="row" style="align-items:flex-end;gap:14px;margin:4px 0 6px"><span class="val">${valTxt}</span>
      <span class="cls" style="color:${c&&c.color?c.color:'var(--tx)'}">${c&&c.label?esc(c.label):''}</span></div>
    <div class="mu xs-t">${esc(info)}</div>
    ${c&&c.scale ? `<div class="scale">${c.scale.map((s,i)=>`<i class="${i===c.idx?'on':''}" style="background:${s.c}" title="${esc(s.l)}"></i>`).join('')}</div>
      <div class="mu xs-t" style="margin-top:8px">${esc(c.criterio)}</div>` : `<div class="mu xs-t" style="margin-top:8px">${esc(c?c.note:'Informe a data de nascimento no perfil.')}</div>`}
  </div>`;
}

function adjW(d){ const i=$('wk'); i.value = Math.max(20, Math.round(((parseFloat(i.value)||0)+d)*10)/10).toFixed(1) }
function wdChange(){
  const d = $('wd').value, ex = S.D.weights.find(w=>w.date===d);

function saveWeight(){

function removeWeight(date){

function saveProfile(){
  const p = S.D.profile || (S.D.profile = {}), u = {};
  const email = $('pe').value.trim().toLowerCase(), phone = $('pt').value.replace(/\D/g,''), h = Number($('ph').value);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return toast('E-mail inválido',true);
  if(phone.length<10||phone.length>13) return toast('Telefone inválido (com DDD)',true);
  if(!(h>=100&&h<=250)) return toast('Altura inválida (100 a 250 cm)',true);
  if(!p.full_name){ const n=$('pn').value.trim().replace(/\s+/g,' '); if(n.split(' ').length<2) return toast('Informe nome e sobrenome',true); u.full_name=n }
  if(!p.birth_date){ const b=$('pb').value; if(!b||b>localDate()||b<'1900-01-01') return toast('Data de nascimento inválida',true); u.birth_date=b }
  if(!p.sex){ const s=$('ps').value; if(!s) return toast('Informe o sexo',true); u.sex=s }
  Object.assign(p, { email, phone, height_cm:h }, u);
  op('updateProfile', Object.assign({ email, phone, height_cm:h }, u));
  toast('Perfil salvo ✓'); if(S.view==='profile' && !profileIncomplete()) go('home');
}
async function changePass(){
  const current=$('pw0').value, next=$('pw1').value;
  if(next.length<4) return toast('A nova senha deve ter no mínimo 4 caracteres',true);

  if(!navigator.onLine) return toast('Para alterar a senha é preciso estar online',true);
  busy(true); const r = await api('changePassword',{current,next}); busy(false);
  if(r.error) return toast(r.error==='OFFLINE'?'Sem conexão com o servidor':r.error,true);
  ['pw0','pw1','pw2'].forEach(i=>$(i).value=''); toast('Senha alterada ✓');
}

    </div>`;
  }
  h += `<button class="btn" style="margin-top:18px" onclick="saveExercise('${eid}',${n})">Salvar exercício ✓</button>`;
  view(h); window.scrollTo(0,0);
}
function adj(id,d){ const i=$(id); i.value = Math.max(0, Math.round(((parseFloat(i.value)||0)+d)*100)/100) }
function setInt(i,v){
  const box=$('set'+i); box.dataset.int=v;
  box.querySelectorAll('.ints button').forEach(b=>{ const on=Number(b.dataset.v)===v; b.className=on?'on':''; b.style.background=on?INT_COLORS[v]:'' });
  $('il'+i).textContent = INT_LABELS[v];
}
function saveExercise(eid,n){
  const c = currentCheckin();
  for(let i=1;i<=n;i++){
    const weight=parseFloat($('w'+i).value)||0, reps=parseInt($('r'+i).value)||0, intensity=Number($('set'+i).dataset.int);
    let s = S.D.sets.find(x=>x.checkin_id===c.id && x.exercise_id===eid && num(x.set_number)===i);
    if(s){ s.weight=weight; s.reps=reps; s.intensity=intensity }
    else S.D.sets.push({ id:uuid(), checkin_id:c.id, exercise_id:eid, set_number:i, weight, reps, intensity });
    op('logSet', { checkinId:c.id, exerciseId:eid, setNumber:i, weight, reps, intensity });
  }
  S.done[eid]=true; toast('Exercício salvo ✓'); rWorkoutList();
}

// ---------- evolução carga ----------
let chart=null;
function rProg(){
  view(`<h2>Evolução Carga</h2><div class="stack">
    <select id="pw" onchange="progWorkout()"><option value="">Selecione o treino</option>
      ${workouts().map(w=>`<option value="${w.id}">Treino ${esc(w.name)}</option>`).join('')}</select>
    <select id="pe" onchange="progLoad()" disabled><option value="">Selecione o exercício</option></select></div>
    <div id="pout" class="mu" style="text-align:center;padding:50px 0"><div style="font-size:44px">📊</div>Escolha um exercício</div>`);
}
function progWorkout(){
  const wid=$('pw').value, s=$('pe');
  if(!wid){ s.disabled=true; return }
  s.innerHTML = '<option value="">Selecione o exercício</option>'+exercisesOf(wid).map(e=>`<option value="${e.id}">${esc(e.name)}${e.muscle?' ('+esc(e.muscle)+')':''}</option>`).join('');
  s.disabled=false;
}
function progLoad(){
  const eid=$('pe').value; if(!eid) return;
  const d = progression(eid), out=$('pout'); out.className=''; out.style.padding='0';
  if(!d.length){ out.innerHTML='<div class="card mu" style="text-align:center;margin-top:14px">Sem registros ainda para este exercício.</div>'; return }
  out.innerHTML = `<div class="card" style="margin-top:14px"><canvas id="ch" height="220"></canvas></div>
    <h3 style="margin:18px 0 8px">Histórico</h3><div class="stack">${d.slice().reverse().map(x=>`
    <div class="hist"><div class="row sp"><b>${fmtDate(x.date)}</b><span><b style="color:var(--ac)">${x.maxWeight} kg</b> <span class="mu sm-t">· ${x.totalReps} reps</span></span></div>
    <div>${x.sets.map(s=>`<span class="chip">${s.set_number}ª ${s.weight}kg×${s.reps} · ${s.intensity}</span>`).join('')}</div></div>`).join('')}</div>`;
  if(chart) chart.destroy();
  if(typeof Chart==='undefined') return;
  chart = new Chart($('ch'),{type:'line',data:{labels:d.map(x=>fmtDate(x.date).slice(0,5)),datasets:[
    {label:'Carga máx. (kg)',data:d.map(x=>x.maxWeight),borderColor:'#ff7a1a',backgroundColor:'rgba(255,122,26,.15)',fill:true,tension:.3,yAxisID:'y'},
    {label:'Intensidade média',data:d.map(x=>x.avgIntensity),borderColor:'#818cf8',tension:.3,yAxisID:'y1'}]},
    options:{plugins:{legend:{labels:{color:'#9097a8'}}},scales:{
      x:{ticks:{color:'#9097a8'},grid:{color:'#2a2e3b'}},
      y:{ticks:{color:'#ff9a4d'},grid:{color:'#2a2e3b'}},
      y1:{position:'right',min:0,max:5,ticks:{color:'#818cf8'},grid:{display:false}}}}});
}

// ---------- fotos ----------
function rPhotos(){
  const p = S.D.photos.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  view(`<button class="link" onclick="go('evo')" style="margin-bottom:10px">← Voltar</button>
    <div class="row sp" style="margin-bottom:14px"><h2 style="margin:0">Evolução Fotos</h2>
    <button class="btn sm" onclick="openCamera()">📷 + Foto</button></div>
    ${p.length?`<div class="grid2">${p.map(x=>`<div class="ph"><img src="${x.local?x.local:esc(x.url)}" loading="lazy" alt="Foto ${fmtDate(x.date)}" onerror="this.style.opacity=.15">
      ${x.local?'<span class="wait">⏳ aguardando envio</span>':''}<button class="x" onclick="delPhoto('${x.id}')">✕</button></div>`).join('')}</div>`
    :`<div class="mu" style="text-align:center;padding:60px 0"><div style="font-size:48px">📸</div>Nenhuma foto ainda</div>`}`);
}
const cam = { stream:null, facing:'environment', shot:null };
function camReset(){
  ['camimg','camconf','camfb'].forEach(hide); ['camv','cambar','camshut','camflip'].forEach(show);
}
function openCamera(){
  camReset(); show('cam');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFallback();
  camStart();
}
async function camStart(){
  camStop();
  try{
    cam.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:cam.facing}, width:{ideal:1280}, height:{ideal:1280} }, audio:false });
    const v = $('camv'); v.srcObject = cam.stream; v.style.transform = cam.facing==='user' ? 'scaleX(-1)' : ''; await v.play();
  }catch(e){ camFallback() }
}
function camStop(){ if(cam.stream){ cam.stream.getTracks().forEach(t=>t.stop()); cam.stream=null } }
function camFallback(){ camStop(); hide('camv'); show('camfb'); hide('camshut'); hide('camflip') }
function camFlip(){ cam.facing = cam.facing==='user' ? 'environment' : 'user'; camStart() }
function camClose(){ camStop(); cam.shot=null; hide('cam') }
function stamp(c){
  const x = c.getContext('2d'), w = c.width, h = c.height, bar = Math.max(36, Math.round(h*0.06)), lw = latestWeight();
  const txt = new Date().toLocaleDateString('pt-BR') + (lw ? '  •  ' + fmtKg(lw.weight_kg) + ' kg' : '');
  x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, h-bar, w, bar);
  x.fillStyle = '#fff'; x.font = 'bold '+Math.round(bar*0.55)+'px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(txt, w/2, h-bar/2);
}
function camShoot(){
  const v = $('camv'); if(!v.videoWidth) return toast('Aguarde a câmera abrir',true);
  const sc = Math.min(1, 1280/Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth*sc); c.height = Math.round(v.videoHeight*sc);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  stamp(c); cam.shot = c;
  $('camimg').src = c.toDataURL('image/jpeg', 0.82);
  show('camimg'); hide('camv'); hide('cambar'); show('camconf'); camStop();
}
function camRetake(){ cam.shot=null; hide('camimg'); hide('camconf'); show('cambar'); show('camv'); camStart() }
function camUse(){ const c = cam.shot; camClose(); if(c) storePhoto(c) }
function photoFromFile(ev){
  const f = ev.target.files[0]; ev.target.value = ''; if(!f) return;
  busy(true);
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, 1280/Math.max(img.width,img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src); stamp(c); busy(false); camClose(); storePhoto(c);
  };
  img.onerror = () => { busy(false); toast('Imagem inválida',true) };
  img.src = URL.createObjectURL(f);
}
function storePhoto(c){
  const now = new Date(), id = uuid(), date = localDate(now), data = c.toDataURL('image/jpeg', 0.82), lw = latestWeight();
  const kg = lw ? num(lw.weight_kg) : null;
  S.D.photos.push({ id, date, weight_kg:kg, local:data });
  op('savePhoto', { id, base64Data:data, filename:'foto_'+date+'_'+Date.now()+'.jpg', date, weight_kg:kg });
  toast(navigator.onLine ? 'Foto salva 📸' : 'Foto salva no aparelho 📸'); rPhotos();
}
function delPhoto(id){
  if(!confirm('Excluir esta foto?')) return;
  S.D.photos = S.D.photos.filter(p=>p.id!==id); op('deletePhoto',{id}); rPhotos();
}

// ---------- configurações ----------
function rSettings(){
  S.view = 'settings';
  ['home','checkin','weight','evo'].forEach(n=>$('n-'+n).classList.remove('on'));
  const w = workouts();
  view(`<h2>Meus treinos</h2>
    <div class="row" style="margin-bottom:12px"><input id="nw" placeholder="Nome do treino (A, B, C...)"><button class="btn sm" onclick="addWorkout()">Criar</button></div>
    <div class="stack">${w.map(x=>`<div class="card row sp"><b>Treino ${esc(x.name)}</b>
      <span class="row"><button class="btn ghost sm" onclick="manageEx('${x.id}')">Exercícios</button>
      <button class="ibtn" onclick="delWorkout('${x.id}')">🗑️</button></span></div>`).join('')||'<p class="mu">Nenhum treino ainda.</p>'}</div>
    <p class="mu xs-t" style="margin-top:10px">A sequência dos treinos segue a ordem de criação (A → B → C → A...).</p>`);
}
function addWorkout(){
  const name=$('nw').value.trim(); if(!name) return;
  const id=uuid(), order_index = Math.max(0,...S.D.workouts.map(w=>num(w.order_index)))+1;
  S.D.workouts.push({id,name,order_index}); op('createWorkout',{id,name,order_index}); rSettings();
}
function delWorkout(id){
  if(!confirm('Excluir treino e exercícios?')) return;
  S.D.workouts = S.D.workouts.filter(w=>w.id!==id); S.D.exercises = S.D.exercises.filter(e=>e.workout_id!==id);
  op('deleteWorkout',{id}); rSettings();
}
function manageEx(wid){
  S.cw = wid; const w = S.D.workouts.find(x=>x.id===wid), ex = exercisesOf(wid);
  view(`<button class="link" onclick="rSettings()" style="margin-bottom:10px">← Voltar</button>
    <h2>Treino ${esc(w?w.name:'')}</h2>
    <div class="card stack"><input id="en" list="exlist" autocomplete="off" placeholder="Nome do exercício (digite ou escolha)" oninput="pickEx()">
      <datalist id="exlist">${exerciseCatalog().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      <select id="eg"><option value="">Região do corpo (opcional)</option>${MUSCLES.map(m=>`<option>${m}</option>`).join('')}</select>
      <div class="row"><input id="es" type="number" inputmode="numeric" placeholder="Nº de séries" min="1" max="10"><button class="btn sm" onclick="addEx()">Adicionar</button></div></div>
    <div class="stack" style="margin-top:14px">${ex.map(e=>`<div class="card row sp"><div><b>${esc(e.name)}</b> ${muscleChip(e)}<div class="mu sm-t">${esc(e.sets_count)} séries</div></div>
      <button class="ibtn" onclick="delEx('${e.id}')">🗑️</button></div>`).join('')||'<p class="mu">Nenhum exercício ainda.</p>'}</div>`);
}
const MUSCLES = ['Peito','Costas','Ombro','Bíceps','Tríceps','Antebraço','Quadríceps','Posterior de coxa','Glúteo','Panturrilha','Abdômen','Cardio'];
const DEFAULT_EXERCISES = [
  ['Supino reto','Peito'],['Supino inclinado','Peito'],['Supino declinado','Peito'],['Crucifixo','Peito'],['Crossover','Peito'],['Flexão de braço','Peito'],
  ['Puxada frontal','Costas'],['Puxada atrás','Costas'],['Remada curvada','Costas'],['Remada baixa','Costas'],['Remada unilateral','Costas'],['Barra fixa','Costas'],['Pulldown','Costas'],['Levantamento terra','Costas'],
  ['Desenvolvimento','Ombro'],['Elevação lateral','Ombro'],['Elevação frontal','Ombro'],['Crucifixo inverso','Ombro'],['Encolhimento','Ombro'],
  ['Rosca direta','Bíceps'],['Rosca alternada','Bíceps'],['Rosca martelo','Bíceps'],['Rosca scott','Bíceps'],
  ['Tríceps pulley','Tríceps'],['Tríceps testa','Tríceps'],['Tríceps corda','Tríceps'],['Tríceps francês','Tríceps'],['Mergulho','Tríceps'],
  ['Agachamento livre','Quadríceps'],['Agachamento hack','Quadríceps'],['Leg press','Quadríceps'],['Cadeira extensora','Quadríceps'],['Avanço','Quadríceps'],['Afundo','Quadríceps'],['Passada','Quadríceps'],
  ['Mesa flexora','Posterior de coxa'],['Cadeira flexora','Posterior de coxa'],['Stiff','Posterior de coxa'],
  ['Cadeira abdutora','Glúteo'],['Cadeira adutora','Glúteo'],['Elevação pélvica','Glúteo'],['Glúteo na polia','Glúteo'],
  ['Panturrilha em pé','Panturrilha'],['Panturrilha sentado','Panturrilha'],
  ['Abdominal','Abdômen'],['Prancha','Abdômen'],['Abdominal infra','Abdômen'],
  ['Esteira','Cardio'],['Bicicleta','Cardio']
];
const muscleChip = e => e && e.muscle ? `<span class="pill">${esc(e.muscle)}</span>` : '';
const exLabel = e => esc(e.name) + (e.muscle ? ' <span class="pill" style="vertical-align:middle">'+esc(e.muscle)+'</span>' : '');
function muscleOfName(name){
  const k = String(name).trim().toLowerCase();
  const mine = S.D.exercises.find(e=>String(e.name).trim().toLowerCase()===k && e.muscle);
  if(mine) return mine.muscle;
  const d = DEFAULT_EXERCISES.find(x=>x[0].toLowerCase()===k);
  return d ? d[1] : '';
}
function exerciseCatalog(){
  const seen = new Map();
  [...S.D.exercises.map(e=>e.name), ...DEFAULT_EXERCISES.map(x=>x[0])].forEach(n => { const k=String(n).trim().toLowerCase(); if(k && !seen.has(k)) seen.set(k, String(n).trim()) });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function pickEx(){
  const k = $('en').value.trim().toLowerCase();
  const known = S.D.exercises.find(e=>String(e.name).trim().toLowerCase()===k);
  if(known && !$('es').value) $('es').value = known.sets_count;
  const m = muscleOfName($('en').value); if(m) $('eg').value = m;
}
function addEx(){
  let name=$('en').value.trim(); const setsCount=parseInt($('es').value);
  if(!name||!setsCount) return toast('Informe nome e séries',true);
  const same = exerciseCatalog().find(n=>n.toLowerCase()===name.toLowerCase()); if(same) name = same;
  const id=uuid(), order_index = Math.max(0,...exercisesOf(S.cw).map(e=>num(e.order_index)))+1;
  const muscle = $('eg').value || muscleOfName(name);
  S.D.exercises.push({id, workout_id:S.cw, name, muscle, sets_count:setsCount, order_index});
  op('createExercise',{id, workoutId:S.cw, name, muscle, setsCount, order_index}); manageEx(S.cw);
}
function delEx(id){
  if(!confirm('Excluir exercício?')) return;
  S.D.exercises = S.D.exercises.filter(e=>e.id!==id); op('deleteExercise',{id}); manageEx(S.cw);
}

// ---------- inicialização ----------
(async function(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}) }
  S.token = lsGet('gt_token'); S.user = lsGet('gt_user');
  document.addEventListener('keydown', e => { if(e.key==='Enter' && !$('login').classList.contains('hidden')){ $('regForm').classList.contains('hidden') ? doLogin() : doRegister() } });
  if(S.token && S.user){ await loadLocal(); enter(true) }
  else if(S.user){ await loadLocal(); show('login'); $('lu').value = S.user }
  else show('login');
})();
</script>
